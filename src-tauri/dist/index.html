<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCopy</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #faf6f1;
        color: #1a1a1a;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        max-width: 480px;
        text-align: center;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 8px;
        color: #555;
        line-height: 1.5;
      }
      .pill {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #efe7da;
        color: #b85c2a;
        font-size: 13px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>OpenCopy</h1>
      <p>Open the dashboard from the tray icon to get started.</p>
      <p class="pill">Running locally · v1.8.0</p>
    </div>
  </body>
</html>
