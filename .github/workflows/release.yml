name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to attach the draft release to'
        required: false

# Builds unsigned Tauri installers for Windows + macOS (Intel + Apple Silicon),
# uploads each to a draft GitHub Release. Colleagues download from the release
# page; first-launch warnings (Gatekeeper / SmartScreen) are bypassed once.

permissions:
  contents: write
  # Required for actions/attest-build-provenance — generates a SLSA-style
  # signed attestation for each artifact, published to the GitHub
  # transparency log so colleagues can verify what built each .exe / .dmg.
  attestations: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node-target: win32-x64
            artifact-glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - os: macos-14
            target: aarch64-apple-darwin
            node-target: darwin-arm64
            artifact-glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Node sidecar binary
        run: node scripts/download-node.mjs --target=${{ matrix.node-target }}

      - name: Build Tauri installer
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          # Tauri's bundled signer is skipped by default when no key is set;
          # we make that explicit so unsigned-build behaviour is consistent.
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact-glob }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencopy-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
