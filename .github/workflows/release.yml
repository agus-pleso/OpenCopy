name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to attach the draft release to'
        required: false

# Builds Tauri installers for Windows + macOS (Apple Silicon), signs them
# with the project's Ed25519 update key, generates a `latest.json` manifest
# for the in-app auto-updater, and uploads everything to a draft GitHub
# Release. First-launch warnings (Gatekeeper / SmartScreen) still apply on
# fresh installs; subsequent versions arrive in-app via the updater.

permissions:
  contents: write
  # Required for actions/attest-build-provenance — generates a SLSA-style
  # signed attestation for each artifact, published to the GitHub
  # transparency log so colleagues can verify what built each .exe / .dmg.
  attestations: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node-target: win32-x64
            # Tauri 2.x produces NSIS `.exe` + MSI `.msi` for distribution
            # and (with `bundle.createUpdaterArtifacts: true`) signs each
            # with a sibling `.sig`. The auto-updater consumes the `.exe`
            # directly + its `.sig` — there is no `.nsis.zip` wrapper in
            # Tauri 2.x (that was a Tauri 1.x convention).
            artifact-glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
          - os: macos-14
            target: aarch64-apple-darwin
            node-target: darwin-arm64
            # `.dmg` is the human-facing installer; `.app.tar.gz` is the
            # compressed `.app` bundle the auto-updater downloads. Both
            # ship to the release.
            artifact-glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Node sidecar binary
        run: node scripts/download-node.mjs --target=${{ matrix.node-target }}

      - name: Build Tauri installer
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          # Ed25519 signing key for the auto-updater. Must be set as a
          # repo secret. tauri build fails if the updater plugin is
          # configured but no signing key is available — that's the
          # right behaviour, signed updates are non-negotiable.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Attest build provenance
        # SLSA build provenance is only available for public repos (or
        # paid organisation plans). On a free-tier private repo this
        # step fails with "Feature not available for user-owned private
        # repositories" — let it fail without sinking the build. When
        # the repo flips public it will start working automatically.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact-glob }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencopy-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      # Tauri's auto-updater fetches `latest.json` from the configured
      # endpoint and matches the running platform against `platforms`.
      # The signature for each platform's bundle is the literal contents
      # of the `.sig` file produced by `tauri build`.
      - name: Build latest.json manifest
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Strip the leading 'v' so the manifest version matches the
          # bundle version (Tauri compares semver without the prefix).
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Files arrive nested one dir deep after `merge-multiple` (e.g.
          # `artifacts/macos/OpenCopy.app.tar.gz`, `artifacts/nsis/...exe`)
          # because actions/upload-artifact preserves the bundle's parent
          # directory. Use `find` instead of a single-level glob so we
          # actually pick them up.
          MAC_BUNDLE=$(find artifacts -name '*.app.tar.gz' -not -name '*.sig' | head -1)
          MAC_SIG_FILE=$(find artifacts -name '*.app.tar.gz.sig' | head -1)
          # Tauri 2.x updater for Windows uses the `-setup.exe` directly;
          # `.nsis.zip` is a stale Tauri 1.x convention.
          WIN_BUNDLE=$(find artifacts -name '*-setup.exe' -not -name '*.sig' | head -1)
          WIN_SIG_FILE=$(find artifacts -name '*-setup.exe.sig' | head -1)

          MAC_SIG=""
          WIN_SIG=""
          [ -n "$MAC_SIG_FILE" ] && MAC_SIG=$(cat "$MAC_SIG_FILE")
          [ -n "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE")

          MAC_URL=""
          WIN_URL=""
          [ -n "$MAC_BUNDLE" ] && MAC_URL="${BASE}/$(basename "$MAC_BUNDLE")"
          [ -n "$WIN_BUNDLE" ] && WIN_URL="${BASE}/$(basename "$WIN_BUNDLE")"

          # Compose the manifest with jq so quoting + newline handling is
          # bulletproof — the .sig contents include literal newlines.
          # History of the two parser errors that bit this step:
          #   v1: `({} as $base) | ...` — `as` can't bind inside a paren'd pipe head.
          #   v2: `(if...) + (if...)` directly after `platforms:` — jq's
          #       object-literal RHS rejects bare `+` between paren'd
          #       expressions ("expected '}'"). Need an outer paren wrap.
          # Build the platforms object in a separate jq invocation, then
          # splice it in via --argjson — sidesteps both syntactic edge
          # cases entirely and keeps the main manifest jq trivially simple.
          PLATFORMS=$(jq -n \
            --arg mac_url "$MAC_URL" \
            --arg mac_sig "$MAC_SIG" \
            --arg win_url "$WIN_URL" \
            --arg win_sig "$WIN_SIG" \
            '
              (if $mac_url != "" then {"darwin-aarch64": {signature: $mac_sig, url: $mac_url}} else {} end)
              +
              (if $win_url != "" then {"windows-x86_64": {signature: $win_sig, url: $win_url}} else {} end)
            ')

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{
              version: $version,
              notes: "See the GitHub release for change notes.",
              pub_date: $pub_date,
              platforms: $platforms
            }' > artifacts/latest.json

          echo "--- latest.json ---"
          cat artifacts/latest.json

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          # latest.json is read by the in-app updater at the URL hard-
          # coded in tauri.conf.json (releases/latest/download/latest.json).
          # GitHub serves /latest/download/<asset> only for non-prerelease
          # releases — promote a tag from draft to "latest" once the build
          # is sanity-checked.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/latest.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
